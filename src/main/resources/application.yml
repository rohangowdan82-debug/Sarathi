spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: sarathi-platform
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/sarathi?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    username: ${DB_USER:sarathi}
    password: ${DB_PASSWORD:sarathi_dev_password}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:12}
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  http:
    converters:
      preferred-json-mapper: jackson2
  jackson:
    default-property-inclusion: non_null
server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
sarathi:
  security:
    jwt-secret: ${JWT_SECRET:replace-this-with-a-random-secret-of-at-least-32-bytes}
    access-ttl-minutes: ${SARATHI_SECURITY_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${SARATHI_SECURITY_REFRESH_TTL_DAYS:30}
    cookie-secure: ${SARATHI_SECURITY_COOKIE_SECURE:false}
  demo-data:
    enabled: ${SARATHI_DEMO_DATA_ENABLED:false}
  app-origin: ${APP_ORIGIN:http://localhost:8080}




