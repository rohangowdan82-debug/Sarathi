services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sarathi
      MYSQL_USER: sarathi
      MYSQL_PASSWORD: sarathi_dev_password
      MYSQL_ROOT_PASSWORD: local_root_password_change_me
    ports:
      - "3306:3306"
    volumes:
      - sarathi_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-plocal_root_password_change_me"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/sarathi?serverTimezone=UTC
      DB_USER: sarathi
      DB_PASSWORD: sarathi_dev_password
      APP_ORIGIN: http://localhost:8080
      JWT_SECRET: local-only-replace-this-secret-with-at-least-32-bytes
      SARATHI_SECURITY_COOKIE_SECURE: "false"
      SARATHI_DEMO_DATA_ENABLED: "true"
      PORT: 8080
    ports:
      - "8080:8080"
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: http://localhost:8081/
    ports:
      - "8081:80"
volumes:
  sarathi_mysql_data:

